name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '**.html'
      - '**.css'
      - '**.js'
      - 'assets/**'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checks:
    name: Check website
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Verify required files
        run: |
          for f in zeppelin-generator.html styles.css index.js; do
            [ -f "$f" ] || { echo "Missing: $f"; exit 1; }
          done

          [ -d "assets" ] || {
            echo "Missing: assets directory"
            exit 1
          }

          echo "All required files present."

  deploy:
    name: Deploy main to gh-pages
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare website
        run: |
          mkdir -p dist
          cp *.html *.css *.js dist/
          cp dist/zeppelin-generator.html dist/index.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4