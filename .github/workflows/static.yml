
# Deploy the stable website from main to gh-pages
name: Deploy static content to gh-pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main to gh-pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Verify website files
        run: |
          echo "Checking website..."

          test -f index.html
          test -f datenschutz.html
          test -f nutzungsbedingungen.html
          test -d assets

          echo "Website files found."
          echo "Website verification successful."

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          exclude_assets: |
            .github
            .git
            .gitignore
            README.md
          force_orphan: false

