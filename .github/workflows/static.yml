
name: Deploy static content to gh-pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main to gh-pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify website files
        run: |
          echo "Checking website..."

          test -f index.html || exit 1
          test -f datenschutz.html || exit 1
          test -f nutzungsbedingungen.html || exit 1
          test -d assets || exit 1

          echo "Website verification successful."

      - name: Prepare gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages || true

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
          fi

      - name: Replace gh-pages content
        run: |
          git rm -rf . || true

          git checkout main -- .

          rm -rf .github
          rm -rf .git
          rm -f .gitignore
          rm -f README.md

      - name: Commit deployment
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi

          git commit -m "Deploy from main"

      - name: Push gh-pages
        run: |
          git push origin gh-pages

